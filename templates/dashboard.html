<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Recovery Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrap">
 
  <div class="masthead">
    <h1>Ledger</h1>
    <div class="tag">Payment Recovery Concierge</div>
  </div>
 
  <div class="ledger-hero">
    <div class="label">Recovered — would've been lost</div>
    <div class="amount"><span class="rupee">₹</span><span id="recoveredAmount">0</span></div>
    <div class="subrow">
      <span><strong id="recoveredCount">0</strong> orders saved</span>
      <span><strong id="lostCount">0</strong> orders lost</span>
      <span><strong id="totalOrders">0</strong> total orders</span>
    </div>
  </div>
 
  <div class="stat-grid">
    <div class="stat-card">
      <div class="n" id="statPaid">0</div>
      <div class="l">Paid total</div>
    </div>
    <div class="stat-card">
      <div class="n" id="statDirect">₹0</div>
      <div class="l">Paid, no follow-up</div>
    </div>
    <div class="stat-card">
      <div class="n" id="statRecoveryRate">0%</div>
      <div class="l">Recovery rate</div>
    </div>
  </div>
 
  <div class="section-title">New order (demo)</div>
  <div class="receipt" style="padding:16px;">
    <form id="newOrderForm" style="display:flex; flex-direction:column; gap:10px;">
      <input id="buyerPhone" placeholder="Buyer WhatsApp number, e.g. +919876543210" required
             style="font-family:var(--font-mono); font-size:0.85rem; padding:8px 10px; border:1px solid var(--rule); border-radius:4px;">
      <input id="amount" type="number" placeholder="Amount in rupees, e.g. 500" required
             style="font-family:var(--font-mono); font-size:0.85rem; padding:8px 10px; border:1px solid var(--rule); border-radius:4px;">
      <input id="description" placeholder="Description, e.g. 2 chocolate cakes" required
             style="font-family:var(--font-body); font-size:0.85rem; padding:8px 10px; border:1px solid var(--rule); border-radius:4px;">
      <button type="submit" style="font-family:var(--font-display); font-weight:600; padding:10px; border:none; border-radius:4px; background:var(--ink); color:var(--paper); cursor:pointer;">
        Create order &amp; send payment link
      </button>
      <div id="newOrderMsg" style="font-size:0.8rem; color:var(--ink-muted);"></div>
    </form>
  </div>
 
  <div class="section-title" style="margin-top:24px;">Recent orders</div>
  <div class="receipt" id="orderList">
    <div class="empty-state">No orders yet — create one above.</div>
  </div>
 
</div>
 
<script>
const STATUS_LABEL = {
  created: { text: 'waiting', cls: 'waiting' },
  failed_once: { text: 'failed', cls: 'waiting' },
  nudged_upi: { text: 'nudged: upi', cls: 'nudged' },
  nudged_reminder: { text: 'nudged', cls: 'nudged' },
  discount_offered: { text: 'discount sent', cls: 'discount' },
  paid: { text: 'paid', cls: 'paid' },
  lost: { text: 'lost', cls: 'lost' },
};
 
function fmtMoney(n) {
  return Math.round(n).toLocaleString('en-IN');
}
 
async function refresh() {
  try {
    const [statsRes, ordersRes] = await Promise.all([
      fetch('/api/stats'), fetch('/api/orders')
    ]);
    const stats = await statsRes.json();
    const orders = await ordersRes.json();
 
    document.getElementById('recoveredAmount').textContent = fmtMoney(stats.recovered_amount_rupees);
    document.getElementById('recoveredCount').textContent = stats.recovered_count;
    document.getElementById('lostCount').textContent = stats.lost;
    document.getElementById('totalOrders').textContent = stats.total_orders;
    document.getElementById('statPaid').textContent = stats.paid;
    document.getElementById('statDirect').textContent = '₹' + fmtMoney(stats.direct_amount_rupees);
 
    const attemptedTotal = stats.recovered_count + stats.lost;
    const rate = attemptedTotal > 0 ? Math.round((stats.recovered_count / attemptedTotal) * 100) : 0;
    document.getElementById('statRecoveryRate').textContent = rate + '%';
 
    const list = document.getElementById('orderList');
    if (orders.length === 0) return;
    list.innerHTML = orders.map(o => {
      const status = STATUS_LABEL[o.status] || { text: o.status, cls: 'waiting' };
      const stampCls = (o.status === 'paid' && o.had_failure) ? 'recovered' : status.cls;
      const stampText = (o.status === 'paid' && o.had_failure) ? 'recovered' : status.text;
      const showButtons = o.status !== 'paid' && o.status !== 'lost';
      const buttons = showButtons ? `
          <button onclick="simulate(${o.id}, 'fail')" class="sim-btn sim-fail" title="Simulate a failed payment attempt">Simulate fail</button>
          <button onclick="simulate(${o.id}, 'pay')" class="sim-btn sim-pay" title="Simulate a successful payment">Simulate pay</button>
        ` : `<a href="${o.razorpay_short_url}" target="_blank" class="sim-btn sim-link">Open link</a>`;
      return `
        <div class="line-item">
          <div class="id">#${o.id}</div>
          <div class="desc">
            <div class="t">${o.description}</div>
            <div class="p">${o.buyer_phone}</div>
          </div>
          <div class="amt">₹${fmtMoney(o.amount_rupees)}</div>
          <div class="stamp ${stampCls}">${stampText}</div>
          <div class="sim-actions">${buttons}</div>
        </div>`;
    }).join('');
  } catch (e) {
    console.error('refresh failed', e);
  }
}
 
async function simulate(orderId, event) {
  await fetch(`/api/simulate/${orderId}/${event}`, { method: 'POST' });
  refresh();
}
 
document.getElementById('newOrderForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msgEl = document.getElementById('newOrderMsg');
  msgEl.textContent = 'Creating order and sending WhatsApp message…';
  try {
    const res = await fetch('/api/create-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        buyer_phone: document.getElementById('buyerPhone').value,
        amount: document.getElementById('amount').value,
        description: document.getElementById('description').value,
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `Request failed (${res.status})`);
    }
    msgEl.textContent = 'Order created — WhatsApp message sent to the buyer.';
    document.getElementById('newOrderForm').reset();
    refresh();
  } catch (err) {
    msgEl.textContent = 'Error: ' + err.message;
  }
});
 
refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
